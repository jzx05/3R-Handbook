name: Handbook audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parser regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Structure audit
        run: python3 scripts/audit.py --strict

      - name: Theory dissection format
        run: python3 scripts/audit_theory.py
